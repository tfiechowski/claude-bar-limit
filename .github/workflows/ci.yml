name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - name: Verify bundle
        run: |
          APP=dist/ClaudeBarLimit.app
          lipo -info $APP/Contents/MacOS/ClaudeBarLimit | grep -q arm64
          lipo -info $APP/Contents/MacOS/ClaudeBarLimit | grep -q x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' $APP/Contents/Info.plist)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' $APP/Contents/Info.plist)" = "dev.tfi.claudebarlimit"
          codesign --verify --deep --strict $APP
